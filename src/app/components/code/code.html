@if (copyable()) {
  <button type="button" class="app-code__copy" (click)="copy()">
    @if (justCopied()) {
      <ng-container i18n="@@code.copied">Kopiert!</ng-container>
    } @else {
      <ng-container i18n="@@code.copy">Code kopieren</ng-container>
    }
  </button>
  <span class="app-code__status" role="status">
    @if (justCopied()) {
      <ng-container i18n="@@code.copiedStatus">Code in die Zwischenablage kopiert</ng-container>
    }
  </span>
}

<pre
  class="app-code__pre"
  [attr.aria-label]="ariaLabel()"
  [attr.data-language]="language()"
  tabindex="0"
  role="region"
><code class="app-code__code">{{ formattedCode() }}</code></pre>
