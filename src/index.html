<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Accessibility Coding-Beispiele</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Apply the stored / OS theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('app-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' ||
        (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
